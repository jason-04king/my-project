<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>전역 D-Day 근합성 일지</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-24 font-sans">

    <!-- 상단 헤더 & D-Day 바 -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <h1 class="font-bold text-lg text-emerald-400"><i class="fa-solid fa-dumbbell mr-2"></i>12.23 전역 & 린매스업</h1>
                <p class="text-xs text-slate-400">목표: 체지방 10% | 골격근 40kg</p>
            </div>
            <div class="text-right">
                <span id="d-day-tag" class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-xs font-bold px-2.5 py-1 rounded-full">D-Day</span>
            </div>
        </div>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="max-w-md mx-auto p-4 space-y-6">

        <!-- 🏠 메인 대시보드 탭 -->
        <section id="tab-dashboard" class="tab-content active space-y-4">
            <!-- 오늘 요약 카드 -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-sm space-y-3">
                <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                    <span id="current-date-text" class="text-sm font-semibold text-slate-300">2026년 10월 --일</span>
                    <span class="text-xs bg-slate-700 px-2 py-0.5 rounded text-slate-300">8일 루틴 진행 중</span>
                </div>
                <div class="grid grid-cols-2 gap-3 text-center">
                    <div class="bg-slate-900/60 p-3 rounded-lg border border-slate-800">
                        <p class="text-xs text-slate-400">오늘의 종합 회복 점수</p>
                        <p id="dash-score" class="text-2xl font-black text-amber-400 mt-1">⭐ - / 10</p>
                    </div>
                    <div class="bg-slate-900/60 p-3 rounded-lg border border-slate-800">
                        <p class="text-xs text-slate-400">오늘 체중</p>
                        <p id="dash-weight" class="text-2xl font-bold text-slate-100 mt-1">--.- kg</p>
                    </div>
                </div>
            </div>

            <!-- 목표 달성 진행 바 -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">목표 매일 섭취율</h3>
                <div class="space-y-2">
                    <div>
                        <div class="flex justify-between text-xs mb-1">
                            <span>탄수화물 (목표 270g)</span>
                            <span id="carb-status" class="text-emerald-400">0g / 270g</span>
                        </div>
                        <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                            <div id="carb-bar" class="bg-emerald-500 h-full w-0 transition-all"></div>
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between text-xs mb-1">
                            <span>단백질 (목표 160g)</span>
                            <span id="protein-status" class="text-blue-400">0g / 160g</span>
                        </div>
                        <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                            <div id="protein-bar" class="bg-blue-500 h-full w-0 transition-all"></div>
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between text-xs mb-1">
                            <span>지방 (목표 60g)</span>
                            <span id="fat-status" class="text-amber-400">0g / 60g</span>
                        </div>
                        <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                            <div id="fat-bar" class="bg-amber-500 h-full w-0 transition-all"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 🏋️ 탭 1: 운동 기록 -->
        <section id="tab-workout" class="tab-content space-y-4">
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-4">
                <h2 class="text-base font-bold text-emerald-400 flex items-center"><i class="fa-solid fa-fire mr-2"></i>오늘 운동 세션</h2>
                
                <div>
                    <label class="block text-xs text-slate-400 mb-1">오늘 회차 선택</label>
                    <select id="workout-day-select" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                        <option value="Day 1">Day 1: 4분할 - 가슴</option>
                        <option value="Day 2">Day 2: 4분할 - 등</option>
                        <option value="Day 3">Day 3: 4분할 - 어깨</option>
                        <option value="Day 4">Day 4: 4분할 - 하체</option>
                        <option value="Day 5">Day 5: 완전 휴식 (OFF)</option>
                        <option value="Day 6">Day 6: 3분할 - Push (밀기)</option>
                        <option value="Day 7">Day 7: 3분할 - Pull (당기기)</option>
                        <option value="Day 8">Day 8: 3분할 - Legs (하체) & 복근</option>
                        <option value="Day 9">Day 9: 완전 휴식 (OFF)</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">세션 구분</label>
                        <select id="workout-type" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-100">
                            <option value="일반훈련">일반 훈련</option>
                            <option value="디로딩">디로딩 (De-load)</option>
                            <option value="PR도전">PR (최고중량) 도전</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">운동 강도 (RPE)</label>
                        <select id="workout-rpe" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-100">
                            <option value="RPE 8">RPE 8 (적정 근비대 - 여유 2회)</option>
                            <option value="RPE 9">RPE 9 (고강도 - 여유 1회)</option>
                            <option value="RPE 10">RPE 10 (실패 지점)</option>
                            <option value="RPE 6~7">RPE 6~7 (디로딩/경량)</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">운동 상세 메모 (종목 / 중량 x 횟수)</label>
                    <textarea id="workout-details" rows="5" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 placeholder-slate-600 focus:outline-none focus:border-emerald-500" placeholder="예:&#10;인클라인 덤벨프레스 28kg 10회 4세트&#10;벤치프레스 80kg 8회 4세트&#10;케이블 크런치 40kg 15회 3세트"></textarea>
                </div>

                <div class="flex items-center space-x-4 pt-1">
                    <label class="flex items-center space-x-2 text-xs text-slate-300">
                        <input type="checkbox" id="chk-abs" class="rounded bg-slate-900 border-slate-700 text-emerald-500 focus:ring-0">
                        <span>복근 진행 완료</span>
                    </label>
                    <label class="flex items-center space-x-2 text-xs text-slate-300">
                        <input type="checkbox" id="chk-cardio" class="rounded bg-slate-900 border-slate-700 text-emerald-500 focus:ring-0">
                        <span>식후 걷기/러닝 완료</span>
                    </label>
                </div>
            </div>
        </section>

        <!-- 🥗 탭 2: 식단 기록 -->
        <section id="tab-diet" class="tab-content space-y-4">
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-4">
                <h2 class="text-base font-bold text-emerald-400 flex items-center"><i class="fa-solid fa-utensils mr-2"></i>식단 및 영양 섭취</h2>

                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">탄수화물(g)</label>
                        <input type="number" id="input-carb" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-center text-slate-100" placeholder="270" value="270">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">단백질(g)</label>
                        <input type="number" id="input-protein" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-center text-slate-100" placeholder="160" value="160">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">지방(g)</label>
                        <input type="number" id="input-fat" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-center text-slate-100" placeholder="60" value="60">
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">오늘 섭취 식단 요약</label>
                    <textarea id="diet-memo" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 placeholder-slate-600 focus:outline-none" placeholder="아침: 닭가슴살 볶음밥&#10;점심: 군대 병영식당 일반식&#10;저녁/PX: 프로틴 음료, 바나나"></textarea>
                </div>

                <div class="border-t border-slate-700 pt-3">
                    <p class="text-xs font-semibold text-slate-300 mb-2">필수 영양제 체크</p>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <label class="flex items-center space-x-2"><input type="checkbox" id="supp-creatine" class="rounded bg-slate-900 border-slate-700 text-emerald-500"> <span>크레아틴 (5g)</span></label>
                        <label class="flex items-center space-x-2"><input type="checkbox" id="supp-vitd" class="rounded bg-slate-900 border-slate-700 text-emerald-500"> <span>비타민 D3/K2</span></label>
                        <label class="flex items-center space-x-2"><input type="checkbox" id="supp-omega" class="rounded bg-slate-900 border-slate-700 text-emerald-500"> <span>오메가3 (1000mg)</span></label>
                        <label class="flex items-center space-x-2"><input type="checkbox" id="supp-mag" class="rounded bg-slate-900 border-slate-700 text-emerald-500"> <span>마그네슘 (2알)</span></label>
                    </div>
                </div>
            </div>
        </section>

        <!-- 🧠 탭 3: 컨디션 & 회복 -->
        <section id="tab-condition" class="tab-content space-y-4">
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-4">
                <h2 class="text-base font-bold text-emerald-400 flex items-center"><i class="fa-solid fa-heart-pulse mr-2"></i>컨디션 & 회복 상태</h2>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">오늘 아침 체중 (kg)</label>
                        <input type="number" step="0.1" id="input-weight" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-100" placeholder="81.9" value="81.9">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">수면 시간 (시간)</label>
                        <input type="number" step="0.5" id="input-sleep" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-100" placeholder="6.5" value="6.5">
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">수면의 질 & 기분/멘탈</label>
                    <select id="select-mood" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100">
                        <option value="상">최상 (의욕 넘침 / 숙면 완료)</option>
                        <option value="중">보통 (평범함 / 약간의 피로)</option>
                        <option value="하">저조 (스트레스 / 수면 부족)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">몸 상태 / 근육통 부위 노트</label>
                    <input type="text" id="input-body-note" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 placeholder-slate-600" placeholder="예: 하체 근육통 약간 남음, 어깨 피로감 적음">
                </div>
            </div>
        </section>

        <!-- ⭐ 탭 4: 종합 점수 및 저장 -->
        <section id="tab-score" class="tab-content space-y-4">
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-4 text-center">
                <h2 class="text-base font-bold text-emerald-400"><i class="fa-solid fa-star mr-2"></i>오늘 하루 근합성 종합 점수</h2>
                
                <div class="py-2">
                    <span id="score-display" class="text-4xl font-black text-amber-400">8 점</span>
                    <input type="range" id="input-score" min="1" max="10" value="8" class="w-full mt-4 accent-emerald-500">
                    <div class="flex justify-between text-[10px] text-slate-500 mt-1">
                        <span>1점 (최악)</span>
                        <span>5점 (보통)</span>
                        <span>10점 (최상의 근합성)</span>
                    </div>
                </div>

                <div>
                    <textarea id="daily-summary" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 placeholder-slate-600 text-left" placeholder="오늘 일과 총평 / 특이사항 메모"></textarea>
                </div>

                <button id="btn-save" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-bold py-3 rounded-xl shadow-lg transition-all text-sm active:scale-95">
                    <i class="fa-solid fa-floppy-disk mr-2"></i>오늘 데이터 저장하기
                </button>
            </div>
        </section>

    </main>

    <!-- 하단 네비게이션 바 -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-800/95 backdrop-blur border-t border-slate-700 p-2 z-50">
        <div class="max-w-md mx-auto grid grid-cols-5 gap-1 text-center">
            <button onclick="switchTab('dashboard')" class="nav-btn active p-2 text-emerald-400 flex flex-col items-center">
                <i class="fa-solid fa-chart-pie text-lg"></i>
                <span class="text-[10px] mt-1">홈</span>
            </button>
            <button onclick="switchTab('workout')" class="nav-btn p-2 text-slate-400 hover:text-emerald-400 flex flex-col items-center">
                <i class="fa-solid fa-dumbbell text-lg"></i>
                <span class="text-[10px] mt-1">운동</span>
            </button>
            <button onclick="switchTab('diet')" class="nav-btn p-2 text-slate-400 hover:text-emerald-400 flex flex-col items-center">
                <i class="fa-solid fa-apple-whole text-lg"></i>
                <span class="text-[10px] mt-1">식단</span>
            </button>
            <button onclick="switchTab('condition')" class="nav-btn p-2 text-slate-400 hover:text-emerald-400 flex flex-col items-center">
                <i class="fa-solid fa-notes-medical text-lg"></i>
                <span class="text-[10px] mt-1">회복</span>
            </button>
            <button onclick="switchTab('score')" class="nav-btn p-2 text-slate-400 hover:text-emerald-400 flex flex-col items-center">
                <i class="fa-solid fa-check-to-slot text-lg"></i>
                <span class="text-[10px] mt-1">점수</span>
            </button>
        </div>
    </nav>

    <script>
        // 전역 D-Day 계산 (2026년 12월 23일)
        const dischargeDate = new Date("2026-12-23");
        const today = new Date();
        const diffTime = dischargeDate - today;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        document.getElementById('d-day-tag').innerText = `전역 D-${diffDays}`;

        // 오늘 날짜 표시
        const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' };
        document.getElementById('current-date-text').innerText = today.toLocaleDateString('ko-KR', options);

        // 탭 전환 함수
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => {
                el.classList.remove('text-emerald-400');
                el.classList.add('text-slate-400');
            });

            document.getElementById(`tab-${tabId}`).classList.add('active');
            event.currentTarget.classList.remove('text-slate-400');
            event.currentTarget.classList.add('text-emerald-400');
        }

        // 슬라이더 바 값 동기화
        const scoreInput = document.getElementById('input-score');
        const scoreDisplay = document.getElementById('score-display');
        scoreInput.addEventListener('input', (e) => {
            scoreDisplay.innerText = `${e.target.value} 점`;
        });

        // 식단 영양소 프로그래스바 동기화
        function updateNutrientBars() {
            const carb = Number(document.getElementById('input-carb').value) || 0;
            const protein = Number(document.getElementById('input-protein').value) || 0;
            const fat = Number(document.getElementById('input-fat').value) || 0;

            document.getElementById('carb-status').innerText = `${carb}g / 270g`;
            document.getElementById('protein-status').innerText = `${protein}g / 160g`;
            document.getElementById('fat-status').innerText = `${fat}g / 60g`;

            document.getElementById('carb-bar').style.width = `${Math.min((carb / 270) * 100, 100)}%`;
            document.getElementById('protein-bar').style.width = `${Math.min((protein / 160) * 100, 100)}%`;
            document.getElementById('fat-bar').style.width = `${Math.min((fat / 60) * 100, 100)}%`;
        }

        ['input-carb', 'input-protein', 'input-fat'].forEach(id => {
            document.getElementById(id).addEventListener('input', updateNutrientBars);
        });

        // 데이터 저장 기능 (LocalStorage)
        document.getElementById('btn-save').addEventListener('click', () => {
            const data = {
                date: new Date().toISOString().split('T')[0],
                weight: document.getElementById('input-weight').value,
                score: document.getElementById('input-score').value,
                carb: document.getElementById('input-carb').value,
                protein: document.getElementById('input-protein').value,
                fat: document.getElementById('input-fat').value,
                workoutDay: document.getElementById('workout-day-select').value,
                workoutDetails: document.getElementById('workout-details').value
            };

            localStorage.setItem(`log_${data.date}`, JSON.stringify(data));
            
            document.getElementById('dash-score').innerText = `⭐ ${data.score} / 10`;
            document.getElementById('dash-weight').innerText = `${data.weight} kg`;
            updateNutrientBars();

            alert('오늘의 근합성 일지가 성공적으로 저장되었습니다!');
            switchTab('dashboard');
        });

        // 초기화 실행
        updateNutrientBars();
    </script>
</body>
</html>
